<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">小红书账号运营数据卡</title>
  <desc id="desc">展示账号内容沉淀、粉丝数以及获赞与收藏数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b86665"/>
      <stop offset="1" stop-color="#e3ad89"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4b2f33" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="1020" cy="110" r="170" fill="none" stroke="#fff" stroke-opacity=".26" stroke-width="2"/>
  <circle cx="1020" cy="110" r="122" fill="none" stroke="#fff" stroke-opacity=".33" stroke-width="2" stroke-dasharray="8 12"/>
  <text x="74" y="102" fill="#fff" font-family="Arial,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" letter-spacing="4">CONTENT OPERATION</text>
  <text x="74" y="174" fill="#fff" font-family="Arial,Microsoft YaHei,sans-serif" font-size="58" font-weight="800">24k纯猪猪侠</text>
  <text x="78" y="216" fill="#fff" fill-opacity=".78" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22">持续更新 · AI视频创作 · 内容复盘</text>
  <g filter="url(#shadow)">
    <rect x="64" y="292" width="326" height="270" rx="22" fill="#fff" fill-opacity=".95"/>
    <rect x="420" y="292" width="326" height="270" rx="22" fill="#fff" fill-opacity=".95"/>
    <rect x="776" y="292" width="360" height="270" rx="22" fill="#fff" fill-opacity=".95"/>
  </g>
  <g fill="#6a3f46" font-family="Arial,Microsoft YaHei,sans-serif">
    <text x="96" y="360" font-size="22">粉丝沉淀</text>
    <text x="96" y="460" font-size="72" font-weight="800">1000+</text>
    <text x="96" y="510" font-size="18" fill="#987477">持续运营账号</text>
    <text x="452" y="360" font-size="22">获赞与收藏</text>
    <text x="452" y="460" font-size="72" font-weight="800">6.3万+</text>
    <text x="452" y="510" font-size="18" fill="#987477">内容反馈累计</text>
    <text x="808" y="360" font-size="22">内容数量</text>
    <text x="808" y="460" font-size="72" font-weight="800">61</text>
    <text x="910" y="460" font-size="28" font-weight="700">篇</text>
    <text x="808" y="510" font-size="18" fill="#987477">持续内容沉淀</text>
  </g>
  <path d="M76 652H1124" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>
  <text x="76" y="700" fill="#fff" fill-opacity=".86" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20">数据卡用于概览账号阶段性运营成果，具体笔记内容以账号页面为准。</text>
</svg>
